<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insect & Flower Identifier (Gemini Vision)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; }
        #results-card, #spinner, #download-csv { display: none; }
        #preview-image { max-height: 400px; object-fit: contain; width: 100%;}
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center mb-4">
            <h1 class="display-5">Insect & Flower Identifier</h1>
        </div>

        <div class="card p-4 shadow-sm">
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-upload-tab" data-bs-toggle="pill" data-bs-target="#pills-upload" type="button" role="tab">Upload Image</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-url-tab" data-bs-toggle="pill" data-bs-target="#pills-url" type="button" role="tab">Use Image URL</button>
                </li>
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="pills-upload" role="tabpanel">
                    <input class="form-control" type="file" id="image-file" accept="image/*">
                </div>
                <div class="tab-pane fade" id="pills-url" role="tabpanel">
                    <input type="text" class="form-control" id="image-url" placeholder="Paste image URL here">
                </div>
            </div>
            <button class="btn btn-primary btn-lg mt-3" id="analyze-btn">Analyze Image</button>
        </div>

        <div id="spinner" class="text-center my-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Calling Gemini API for analysis, please wait...</p>
        </div>

        <div id="results-card" class="card mt-4 shadow-sm">
            <div class="card-header">
                Analysis Result
            </div>
            <div class="card-body">
                <div class="text-center mb-3">
                    <img src="#" id="preview-image" class="img-fluid rounded" alt="Image preview">
                </div>
                <h5 class="card-title">Details</h5>
                <table class="table table-bordered table-striped">
                    <tbody id="results-table"></tbody>
                </table>
                <button class="btn btn-success mt-2" id="download-csv">Download Results (CSV)</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Modified: No url_for, direct path -->
    <script src="/static/script.js"></script> 
</body>
</html>
